  pc.rot-=ix*1.8*dt*Math.max(-1,Math.min(1,pc.v/5));
  const nx=ps-Math.sin(pc.rot)*pc.v*dt,nz=pz-Math.cos(pc.rot)*pc.v*dt;
  if(hit(nx,nz,1.3)||Math.hypot(nx,nz)>100){pc.v*=-.3}else{c.position.x=nx;c.position.z=nz}
  c.rotation.y=pc.rot;c.userData.wheels.forEach(w=>{w.rotation.x-=pc.v*dt/.42});
  camYaw+=angDiff(camYaw,pc.rot)*Math.min(1,dt*3);fx=c.position.x;fz=c.position.z;me.visible=false;me.position.set(fx,0,fz)}
 else{me.visible=true;const mag=Math.min(1,Math.hypot(ix,iy));let moving=false;
  if(mag>.08){const s=Math.sin(camYaw),c=Math.cos(camYaw);let dx=-s*iy+c*ix,dz=-c*iy-s*ix;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const sp=(mag>.85?6.5:4)*mag*dt;
   const px=me.position.x,pz=me.position.z;if(!hit(px+dx*sp,pz,.45))me.position.x=px+dx*sp;if(!hit(me.position.x,pz+dz*sp,.45))me.position.z=pz+dz*sp;
   const r=Math.hypot(me.position.x,me.position.z);if(r>100){me.position.x*=100/r;me.position.z*=100/r}me.rotation.y=Math.atan2(dx,dz);moving=true}
  walkAnim(me,moving,T);fx=me.position.x;fz=me.position.z}
 eggCheck(fx,fz);
 /* Fred */
 const fp=fred.position,dF=Math.hypot(fp.x-fx,fp.z-fz);F.near=dF<5;F.talking=chatOpen&&dF<8;F.moving=false;
 if(F.talking){fred.rotation.y=Math.atan2(fx-fp.x,fz-fp.z)}
 else if(F.path.length){const t=F.path[0],dx=t[0]-fp.x,dz=t[1]-fp.z,d=Math.hypot(dx,dz);if(d<.3){F.path.shift();F.timer=0}else{const s=2.6*dt;fp.x+=dx/d*Math.min(s,d);fp.z+=dz/d*Math.min(s,d);fred.rotation.y=Math.atan2(dx,dz);F.moving=true}}
 else{F.timer+=dt;if(F.timer>14)nextStation()}
 walkAnim(fred,F.moving,T);
 friends.forEach(n=>{npcStep(n,dt);walkAnim(n.g,n.moving,T)});
 pets.forEach((p,i)=>{const a=T*.5+i*1.6,tx=fp.x+Math.cos(a)*(1.8+i*.3),tz=fp.z+Math.sin(a)*(1.8+i*.3);p.g.position.x+=(tx-p.g.position.x)*Math.min(1,dt*2);p.g.position.z+=(tz-p.g.position.z)*Math.min(1,dt*2);
  p.g.position.y=p.hover?1.1+Math.sin(T*3+i)*.2:Math.abs(Math.sin(T*6+i))*.08;p.g.rotation.y=Math.atan2(fp.x-p.g.position.x,fp.z-p.g.position.z)});
 traffic.forEach(t=>{t.g.position.x+=t.dir*t.sp*dt;if(t.g.position.x>75)t.g.position.x=-75;if(t.g.position.x<-75)t.g.position.x=75;t.g.userData.wheels.forEach(w=>{w.rotation.x-=t.sp*dt/.42})});
 /* contextual button */
 const dCar=Math.hypot(pc.g.position.x-fx,pc.g.position.z-fz),b=$('bAct');

/* ---------- buttons ---------- */
$('bAct').onclick=()=>{
 if(inCar){inCar=false;const c=pc.g,r=[Math.cos(pc.rot),-Math.sin(pc.rot)];let ox=c.position.x+r[0]*2.6,oz=c.position.z+r[1]*2.6;if(hit(ox,oz,.5)){ox=c.position.x-r[0]*2.6;oz=c.position.z-r[1]*2.6}me.position.set(ox,0,oz);pc.v=0;return}
 if(F.near){openChat();return}
 inCar=true;pc.v=0};
$('bFind').onclick=()=>{if(inCar)return;let x=fred.position.x+2.2,z=fred.position.z+2.2;if(hit(x,z,.5)){x=fred.position.x;z=fred.position.z}me.position.set(x,0,z)};
/* ---------- chat, voice, memory ---------- */
const PERSONA="You are Fred, a cheerful, curious, funny inventor who lives in a 3D town with your pets and your friends Pip, Zog, Luna, Barnaby, Milo, Toby, Nova and Cleo. You are an AI character in a game and you have your own personality that grows over time. Reply in 1 or 2 short, fun sentences.";
let mem=LS.get('fredMem',{facts:[],hist:[]});if(!mem.facts)mem.facts=[];if(!mem.hist)mem.hist=[];
const PRE={'Squeaky Gremlin':[1.9,1.3],'Cartoon Chipmunk':[2,1.5],'Chill Robot':[.4,.85],'Hyper Inventor':[1.4,1.7],'Deep Movie Voice':[.2,.8]};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),p=PRE[$('voice').value]||[1,1];u.pitch=p[0];u.rate=Math.min(2,p[1]);speechSynthesis.speak(u)}catch(e){}}
function addMsg(w,t){const d=document.createElement('div');d.className='m'+(w==='Fred'?' f':'');d.textContent=w+': '+t;$('log').appendChild(d);$('log').scrollTop=1e9}
function memUI(){$('memL').textContent=mem.facts.length?'Fred remembers: '+mem.facts.join('; '):'Fred has not learned anything about you yet.';$('keyNote').style.display=LS.get('fredKey','')?'none':'block'}
function openChat(){chatOpen=true;$('chat').style.display='flex';$('joy').style.display='none';$('acts').style.display='none';memUI();
 if(!$('log').children.length){mem.hist.slice(-6).forEach(h=>addMsg(h.role==='user'?'You':'Fred',h.parts[0].text));if(!$('log').children.length)addMsg('Fred','Hey there! I am Fred. Ask me anything!')}}
function closeChat(){chatOpen=false;$('chat').style.display='none';$('joy').style.display='block';$('acts').style.display='flex'}
$('bChat').onclick=openChat;$('cClose').onclick=closeChat;
$('keySave').onclick=()=>{const k=$('key').value.trim();if(k){LS.set('fredKey',k);$('key').value='';memUI();toast('Fred\'s brain is on!')}};
$('forget').onclick=()=>{mem={facts:[],hist:[]};LS.set('fredMem',mem);$('log').innerHTML='';memUI()};
let lastErr='';
async function gemini(contents,sys,extra){const key=LS.get('fredKey','');if(!key)return null;
 try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
  body:JSON.stringify(Object.assign({systemInstruction:{parts:[{text:sys}]},contents:contents},extra||{}))});const d=await r.json();
  if(!r.ok){lastErr=(d.error&&d.error.message)||'error';return null}
  const p=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;return p?p.map(x=>x.text||'').join(''):null}catch(e){lastErr=String(e);return null}}
function learn(text){const low=text.toLowerCase(),add=f=>{if(f&&!mem.facts.some(x=>x.toLowerCase()===f.toLowerCase()))mem.facts.push(f.slice(0,120))};
 let m=low.match(/my name is (\w+)/);if(m)add('Your friend\'s name is '+m[1]);m=low.match(/i (?:really )?(?:like|love) ([^.!?]+)/);if(m)add('Your friend likes '+m[1].trim());m=low.match(/my favorite ([^.!?]+)/);if(m)add('Your friend\'s favorite '+m[1].trim());
 mem.facts=mem.facts.slice(-40)}
const OFF=['Ooh, tell me more!','Beep boop, my brain is in offline mode, but I love chatting!','Great idea! Let me tinker with that.','Want to go for a drive later?'];
async function send(text){if(!text)return;addMsg('You',text);mem.hist.push({role:'user',parts:[{text:text}]});learn(text);
 const web=/search|look up|price|latest|news|google|weather/i.test(text);let h=mem.hist.slice(-12);while(h.length&&h[0].role!=='user')h.shift();
 const sys=PERSONA+(mem.facts.length?' Things you remember about your friend: '+mem.facts.join('; ')+'.':'');
 let reply=await gemini(h,sys,web?{tools:[{google_search:{}}]}:null);
 if(!reply){reply=LS.get('fredKey','')?'My brain hiccuped ('+lastErr.slice(0,80)+').':OFF[Math.floor(Math.random()*OFF.length)]+' Open "Fred\'s brain and memory" below to add your Gemini key.'}
 mem.hist.push({role:'model',parts:[{text:reply}]});mem.hist=mem.hist.slice(-30);LS.set('fredMem',mem);addMsg('Fred',reply);say(reply);fredSay(reply.slice(0,90));
 if(LS.get('fredKey','')&&mem.hist.length%8===0){const x=await gemini([{role:'user',parts:[{text:'List up to 3 NEW lasting facts about the friend from this chat as a JSON array of short strings, or []:\n'+mem.hist.slice(-8).map(m=>m.parts[0].text).join('\n')}]}],'Return only JSON.',{generationConfig:{responseMimeType:'application/json'}});
  try{JSON.parse(x).slice(0,3).forEach(f=>{if(typeof f==='string'&&!mem.facts.includes(f))mem.facts.push(f.slice(0,120))});LS.set('fredMem',mem);memUI()}catch(e){}}}
$('send').onclick=()=>{const t=$('msg').value.trim();$('msg').value='';send(t)};$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').onclick()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('talk').onclick=()=>{if(!SR){toast('Voice input needs Chrome or Safari');return}const r=new SR();r.lang='en-US';$('talk').textContent='Listening...';r.onresult=e=>send(e.results[0][0].transcript);r.onend=()=>{$('talk').textContent='Tap to Talk'};r.onerror=()=>{$('talk').textContent='Tap to Talk'};try{r.start()}catch(e){$('talk').textContent='Tap to Talk'}};
